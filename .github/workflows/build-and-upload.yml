name: Build and Upload Content Editor

on:
  push:
    branches:
      - '*'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 10.24.1
      CHROME_BIN: google-chrome
      editorType: contentEditor
      framework_version_number: ${{ github.ref_name }}
      editor_version_number: ${{ github.ref_name }}
      build_number: ${{ github.sha }}
      CLOUD_PROVIDER: ${{ secrets.CLOUD_PROVIDER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Cache bower components
        uses: actions/cache@v3
        with:
          path: app/bower_components
          key: ${{ runner.os }}-bower-${{ hashFiles('app/bower.json') }}

      - name: Set up NVM and Node.js
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
          nvm install ${{ env.NODE_VERSION }}
          nvm use ${{ env.NODE_VERSION }}
          node -v

      - name: Set environment variables
        run: |
          echo "framework_version_number=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "editorType=contentEditor" >> $GITHUB_ENV
          echo "editor_version_number=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "build_number=${{ github.sha }}" >> $GITHUB_ENV
          echo "CHROME_BIN=google-chrome" >> $GITHUB_ENV

      - name: Clean up previous builds
        run: |
          rm -rf ansible/content-editor.zip
          rm -rf content-editor

      - name: Install system dependencies (build-essential, libpng-dev)
        run: sudo apt-get install -y build-essential libpng-dev

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies and build
        run: |
          npm install
          npm run bower-install
          npm run package-core-plugins
          npm run build-plugins
          npm run build

      - name: Create build artifact (zip)
        run: |
          zip -r content-editor-${{ github.ref_name }}-${{ github.sha }}.zip content-editor

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-editor
          path: content-editor-${{ github.ref_name }}-${{ github.sha }}

