name: Build and Upload Content Editor

on:
  push:
    branches:
      - '*'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 10.24.1
      CHROME_BIN: google-chrome
      editorType: contentEditor
      framework_version_number: ${{ github.ref_name }}
      editor_version_number: ${{ github.ref_name }}
      build_number: ${{ github.sha }}
      CLOUD_PROVIDER: ${{ secrets.CLOUD_PROVIDER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Cache bower components
        uses: actions/cache@v3
        with:
          path: app/bower_components
          key: ${{ runner.os }}-bower-${{ hashFiles('app/bower.json') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev google-chrome-stable

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install global npm tools
        run: npm install -g bower@1.8.14 gulp@3.9.1

      - name: Clone sunbird-content-plugins
        run: git clone https://github.com/project-sunbird/sunbird-content-plugins.git plugins -b release-5.2.0

      - name: Install dependencies
        run: |
          npm install
          cd app
          npm run bower-install
          cd ..

      - name: Build and package
        run: |
          npm run package-core-plugins
          npm run build-plugins
          npm run build

      - name: Create build artifact (zip)
        run: |
          zip -r content-editor-${{ github.ref_name }}-${{ github.sha }}.zip content-editor

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-editor
          path: content-editor-${{ github.ref_name }}-${{ github.sha }}.zip

