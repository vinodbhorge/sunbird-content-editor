name: Build and Upload Content Editor

on:
  push:
    branches:
      - '*'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 10.24.1
      CHROME_BIN: google-chrome
      editorType: contentEditor
      framework_version_number: ${{ github.ref_name }}
      editor_version_number: ${{ github.ref_name }}
      build_number: ${{ github.sha }}
      CLOUD_PROVIDER: gcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev google-chrome-stable

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install global npm tools
        run: npm install -g bower@1.8.14 gulp@3.9.1

      - name: Clone sunbird-content-plugins
        run: git clone https://github.com/project-sunbird/sunbird-content-plugins.git plugins -b release-5.2.0

      - name: Clean previous build artifacts
        run: |
          rm -rf ansible/content-editor.zip
          rm -rf content-editor

      - name: Clean npm cache and install dependencies
        run: |
          npm cache clean --force
          npm install

      - name: Install bower dependencies
        run: |
          cd app
          bower cache clean --allow-root
          bower prune -f --allow-root
          bower install --force -V --allow-root
          cd ..

      - name: Package core plugins
        run: gulp packageCorePlugins

      - name: Build plugins
        run: npm run build-plugins

      - name: Build main project
        run: npm run build

      # --- Upload to Azure Blob Storage ---
      # - name: Upload to Azure Blob Storage
      #   if: env.CLOUD_PROVIDER == 'azure'
      #   uses: azure/CLI@v1
      #   with:
      #     azcliversion: 2.0.72
      #     inlineScript: |
      #       az storage blob upload-batch \
      #         --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
      #         --destination ${{ secrets.AZURE_STORAGE_CONTAINER }}/content-editor-${{ github.ref_name }}-${{ github.sha }} \
      #         --source content-editor \
      #         --account-key ${{ secrets.AZURE_STORAGE_KEY }}

      # --- Upload to AWS S3 ---
      # - name: Upload to AWS S3
      #   if: env.CLOUD_PROVIDER == 'aws'
      #   uses: jakejarvis/s3-sync-action@master
      #   with:
      #     args: --acl public-read --delete
      #   env:
      #     AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
      #     AWS_REGION: 'us-east-1'
      #     SOURCE_DIR: 'content-editor'
      #     DEST_DIR: 'content-editor/${{ github.ref_name }}-${{ github.sha }}/'

      # --- Upload to Google Cloud Storage ---
      - name: Upload to Google Cloud Storage
        if: env.CLOUD_PROVIDER == 'gcp'
        uses: google-github-actions/upload-cloud-storage@v1
        with:
          path: sunbird-content-editor/
          destination: ${{ secrets.GCP_BUCKET }}/content-editor-${{ github.ref_name }}-${{ github.sha }}/
          credentials: ${{ secrets.GCP_CREDENTIALS }}